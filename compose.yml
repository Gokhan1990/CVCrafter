services:
  cv-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cv-backend
    ports:
      - "3001:3001"
    environment:
      DB_HOST: cv-db
      DB_PORT: "5432"
      DB_USER: cvuser
      DB_PASS: cvpass
      DB_NAME: cvapp
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - uploads:/app/uploads
      - analysis:/app/analysis
    depends_on:
      cv-db:
        condition: service_healthy
    restart: unless-stopped

  cv-app:
    build: .
    container_name: cv-creator
    ports:
      - "8080:80"
    depends_on:
      - cv-backend
    restart: unless-stopped

  cv-db:
    image: postgres:16-alpine
    container_name: cv-postgres
    environment:
      POSTGRES_USER: cvuser
      POSTGRES_PASSWORD: cvpass
      POSTGRES_DB: cvapp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvuser -d cvapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
  analysis:



